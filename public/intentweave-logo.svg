<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <defs>
    <linearGradient id="frontBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4f7a3"/>
      <stop offset="55%" stop-color="#89e46f"/>
      <stop offset="100%" stop-color="#58c455"/>
    </linearGradient>
    <linearGradient id="rearBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79d86c"/>
      <stop offset="55%" stop-color="#2cab55"/>
      <stop offset="100%" stop-color="#0e6f3f"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#03150d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="500" height="600" fill="#06080b"/>

  <g transform="translate(250 220)">
    <g transform="rotate(45)" filter="url(#softShadow)">
      <!-- Back round loops -->
      <path d="M -40 -114 Q -114 -40 -114 0 Q -114 40 -40 114" fill="none" stroke="url(#rearBand)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 40 -114 Q 114 -40 114 0 Q 114 40 40 114" fill="none" stroke="url(#rearBand)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Front woven ribbons -->
      <line x1="-152" y1="-42" x2="152" y2="-42" stroke="url(#frontBand)" stroke-width="46" stroke-linecap="round"/>
      <line x1="-152" y1="42" x2="152" y2="42" stroke="url(#frontBand)" stroke-width="46" stroke-linecap="round"/>
    </g>
  </g>

  <text
    x="250" y="430"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="68" font-weight="700" letter-spacing="-1">
    <tspan fill="#ffffff">Intent</tspan><tspan fill="#75df62">Weave</tspan>
  </text>
  <text
    x="250" y="476"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="20" fill="#98a0ae" letter-spacing="1">intentweave.org</text>
</svg>
