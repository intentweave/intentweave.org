<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <!--
    IntentWeave wordmark — LIGHT background variant
    Dark "Intent" + green "Weave". Transparent bg — designed for light/white surfaces.
    Same mark geometry as the dark variant; slightly deeper greens for white-bg contrast.
  -->
  <defs>
    <!-- B strands: top-to-bottom gradient -->
    <linearGradient id="grad-b" gradientUnits="objectBoundingBox"
        x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#bbf7d0"/>
      <stop offset="25%"  stop-color="#22c55e"/>
      <stop offset="75%"  stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <!-- A strands: left-to-right gradient -->
    <linearGradient id="grad-a" gradientUnits="objectBoundingBox"
        x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="30%"  stop-color="#16a34a"/>
      <stop offset="72%"  stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Basket-weave clip paths (pre-rotation coords) -->
    <clipPath id="cp-b1" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M88,95 H412 V169 H88 Z  M150,95 H224 V169 H150 Z"/>
    </clipPath>
    <clipPath id="cp-b2" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M88,221 H412 V295 H88 Z  M276,221 H350 V295 H276 Z"/>
    </clipPath>
    <clipPath id="cp-a1" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M150,33 H224 V357 H150 Z  M150,221 H224 V295 H150 Z"/>
    </clipPath>
    <clipPath id="cp-a2" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M276,33 H350 V357 H276 Z  M276,95 H350 V169 H276 Z"/>
    </clipPath>
    <clipPath id="cp-diamond">
      <polygon points="250,63 387,195 250,327 113,195"/>
    </clipPath>
  </defs>

  <!-- White background -->
  <rect width="500" height="600" fill="#ffffff"/>

  <!-- Woven lattice mark -->
  <g clip-path="url(#cp-diamond)">
    <g transform="rotate(45,250,195)">
      <rect x="88"  y="95"  width="324" height="74" rx="37" fill="url(#grad-b)" clip-path="url(#cp-b1)"/>
      <rect x="88"  y="221" width="324" height="74" rx="37" fill="url(#grad-b)" clip-path="url(#cp-b2)"/>
      <rect x="150" y="33"  width="74"  height="324" rx="37" fill="url(#grad-a)" clip-path="url(#cp-a1)"/>
      <rect x="276" y="33"  width="74"  height="324" rx="37" fill="url(#grad-a)" clip-path="url(#cp-a2)"/>
    </g>
  </g>

  <!-- Logotype -->
  <text
    x="250" y="410"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="68" font-weight="700" letter-spacing="-1">
    <tspan fill="#111111">Intent</tspan><tspan fill="#16a34a">Weave</tspan>
  </text>
  <text
    x="250" y="455"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="20" fill="#6b7280" letter-spacing="1">intentweave.org</text>
</svg>
