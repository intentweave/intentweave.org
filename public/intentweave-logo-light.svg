<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <defs>
    <!-- Global diagonal lighting for a 45-deg rotated context -->
    <linearGradient id="grad-bands" gradientUnits="userSpaceOnUse" x1="-160" y1="0" x2="160" y2="0">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="25%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <linearGradient id="grad-ring" gradientUnits="userSpaceOnUse" x1="-160" y1="0" x2="160" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Unified Drop Shadow falling down-right (in rotated space) -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>

    <!-- Clip path to hide the top part of V1 for the final weave overlap -->
    <clipPath id="clip-bottom-left">
      <rect x="-80" y="-15" width="80" height="180" />
    </clipPath>

    <!-- Primitive bands for 2x2 weave -->
    <rect id="v1" x="-58" y="-140" width="36" height="280" rx="18" />
    <rect id="v2" x="22"  y="-140" width="36" height="280" rx="18" />
    <rect id="h1" x="-140" y="-58" width="280" height="36" rx="18" />
    <rect id="h2" x="-140" y="22"  width="280" height="36" rx="18" />
  </defs>

  <rect width="500" height="600" fill="#ffffff"/>

  <!-- Rotated Logo Group: Perfect layering ensures natural shadows with zero visual seams -->
  <g transform="translate(250 205) rotate(45)">
    <!-- Background Ring -->
    <circle cx="0" cy="0" r="115" stroke-width="36" fill="none" stroke="url(#grad-ring)" filter="url(#shadow)"/>

    <!-- Left vertical -->
    <use href="#v1" fill="url(#grad-bands)" filter="url(#shadow)"/>
    <!-- Top horizontal (covers left) -->
    <use href="#h1" fill="url(#grad-bands)" filter="url(#shadow)"/>
    <!-- Right vertical (covers top) -->
    <use href="#v2" fill="url(#grad-bands)" filter="url(#shadow)"/>
    <!-- Bottom horizontal (covers right) -->
    <use href="#h2" fill="url(#grad-bands)" filter="url(#shadow)"/>
    
    <!-- Redrawn Left vertical (clipped to cover bottom horizontal seamlessly) -->
    <g clip-path="url(#clip-bottom-left)">
      <use href="#v1" fill="url(#grad-bands)" filter="url(#shadow)"/>
    </g>
  </g>

  <!-- Wordmark Text -->
  <text x="250" y="440" text-anchor="middle" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#0f172a">Intent</tspan><tspan fill="#22c55e">Weave</tspan>
  </text>
  <!-- Tagline -->
  <text x="250" y="482" text-anchor="middle" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#6b7280" letter-spacing="1">intentweave.org</text>
</svg>
