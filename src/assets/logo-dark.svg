<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    IntentWeave woven lattice mark — dark background variant
    Design: 4 ribbons (2 × "B" horizontal + 2 × "A" vertical in pre-rotation space)
    arranged in a 2×2 basket weave, rotated 45° and clipped to a diamond.
    Weave: A1↑B1 (top), B1↑A2 (right), B2↑A1 (left), A2↑B2 (bottom).
  -->
  <defs>
    <!-- B-strand gradients (mint → green, perpendicular highlight on dark bg) -->
    <linearGradient id="gb1" gradientUnits="userSpaceOnUse" x1="100" y1="65" x2="100" y2="95">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="45%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="gb2" gradientUnits="userSpaceOnUse" x1="100" y1="105" x2="100" y2="135">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="45%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <!-- A-strand gradients (deeper forest green) -->
    <linearGradient id="ga1" gradientUnits="userSpaceOnUse" x1="65" y1="100" x2="95" y2="100">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ga2" gradientUnits="userSpaceOnUse" x1="105" y1="100" x2="135" y2="100">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <!--
      Weave clip paths (pre-rotation coordinate system).
      Each strand is clipped to its full band minus the one intersection
      where the crossing strand goes on top.
      Evenodd rule: outer rect (band) minus inner rect (excluded intersection).
    -->
    <!-- B1 shows everywhere in its band except TL (x=65..95, y=65..95) where A1 is on top -->
    <clipPath id="cp-b1" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M5,65H195V95H5Z M65,65H95V95H65Z"/>
    </clipPath>
    <!-- B2 shows everywhere except BR (x=105..135, y=105..135) where A2 is on top -->
    <clipPath id="cp-b2" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M5,105H195V135H5Z M105,105H135V135H105Z"/>
    </clipPath>
    <!-- A1 shows everywhere except BL (x=65..95, y=105..135) where B2 is on top -->
    <clipPath id="cp-a1" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M65,5H95V195H65Z M65,105H95V135H65Z"/>
    </clipPath>
    <!-- A2 shows everywhere except TR (x=105..135, y=65..95) where B1 is on top -->
    <clipPath id="cp-a2" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" d="M105,5H135V195H105Z M105,65H135V95H105Z"/>
    </clipPath>
    <!-- Diamond outer clip (screen coordinates, applied after rotation) -->
    <clipPath id="cp-diamond">
      <polygon points="100,12 188,100 100,188 12,100"/>
    </clipPath>
  </defs>
  
  <!-- Woven lattice: rotated group clipped to diamond -->
  <g clip-path="url(#cp-diamond)">
    <g transform="rotate(45,100,100)">
      <!-- B strands: light mint, become "/" diagonals after rotation -->
      <rect x="5" y="65" width="190" height="30" fill="url(#gb1)" clip-path="url(#cp-b1)"/>
      <rect x="5" y="105" width="190" height="30" fill="url(#gb2)" clip-path="url(#cp-b2)"/>
      <!-- A strands: deeper green, become "\" diagonals after rotation -->
      <rect x="65" y="5" width="30" height="190" fill="url(#ga1)" clip-path="url(#cp-a1)"/>
      <rect x="105" y="5" width="30" height="190" fill="url(#ga2)" clip-path="url(#cp-a2)"/>
    </g>
  </g>
</svg>
